<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Test 8267 transform</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/Anton.ttf"); }
      @font-face { font-family: "Dancing Script"; src: url("assets/fonts/DancingScript.ttf"); font-weight: 400 700; }
      @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
      :root {
        --violet: #3b0c5b;
        --violet-2: #451f61;
        --lilac: #c9a6ff;
        --shirt: #f3f1ee;
        --lime: #d4ff3a;
      }
      body { margin: 0; background: #12041c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #12041c; }
      .layer { position: absolute; inset: 0; }
      #backdrop { background: radial-gradient(120% 70% at 50% 35%, #6a2a9a 0%, var(--violet) 55%, #12041c 100%); }
      .cam { position: absolute; inset: 0; transform-origin: 540px 820px; }
      .cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .behind, .front { position: absolute; inset: 0; opacity: 0; }

      /* beat 1 */
      #b1-big { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font: 560px/1 "Anton"; color: var(--shirt); letter-spacing: 6px; }
      #b1-script { position: absolute; left: 0; right: 0; top: 1160px; text-align: center; font: 700 230px/1 "Dancing Script"; color: var(--lime); text-shadow: 0 0 28px rgba(212,255,58,.55); transform-origin: 50% 50%; }

      /* beat 2 */
      .wall-row { position: absolute; left: -400px; width: 1880px; white-space: nowrap; font: 250px/1 "Anton"; letter-spacing: 4px; }
      .wall-row.fill { color: var(--shirt); }
      .wall-row.line { color: var(--violet); -webkit-text-stroke: 4px var(--lime); }
      #b2-pill { position: absolute; left: 50%; top: 1370px; width: 760px; margin-left: -380px; padding: 26px 0; border-radius: 80px; background: var(--lime); color: #1a0629; text-align: center; font: 700 58px/1 "Be Vietnam Pro"; }

      /* beat 3 */
      #before-wrap { position: absolute; inset: 0; transform-origin: 540px 960px; opacity: 0; }
      #before-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.25) brightness(.8); }
      .tag { position: absolute; padding: 14px 30px; border-radius: 40px; background: rgba(18,4,28,.78); color: #fff; font: 700 40px/1 "Be Vietnam Pro"; display: flex; align-items: center; gap: 14px; }
      .tag i { display: block; width: 18px; height: 18px; border-radius: 50%; }
      #b3-title { position: absolute; left: 0; right: 0; top: 260px; text-align: center; font: 150px/1 "Anton"; color: var(--shirt); }
      #b3-title span { color: var(--lime); }

      /* beat 4 */
      #b4-l1, #b4-l2 { position: absolute; left: 0; right: 0; text-align: center; font: 300px/1.1 "Anton"; }
      #b4-l1 { top: 250px; color: var(--shirt); }
      #b4-l2 { top: 510px; color: var(--lime); }
      #b4-script { position: absolute; left: 0; right: 0; top: 1270px; text-align: center; font: 700 190px/1 "Dancing Script"; color: #fff; text-shadow: 0 0 24px rgba(201,166,255,.8); }
      .burst { position: absolute; width: 200px; height: 200px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="10.4">
      <div id="backdrop" class="layer"></div>

      <!-- "Trước" card for beat 3 -->
      <div id="before-wrap">
        <video id="v-before" src="assets/aroll.mp4" muted playsinline data-start="0" data-duration="10.4" data-track-index="0"></video>
      </div>

      <div id="cam-bg" class="cam">
        <video id="v-bg" src="assets/aroll.mp4" muted playsinline data-start="0" data-duration="10.4" data-track-index="1"></video>
      </div>

      <!-- text that sits behind the person -->
      <div id="b1-behind" class="behind" data-layout-allow-occlusion data-layout-allow-overflow><div id="b1-big" data-layout-allow-occlusion>EDIT</div></div>
      <div id="b2-behind" class="behind" data-layout-allow-occlusion data-layout-allow-overlap>
        <div data-layout-allow-occlusion class="wall-row fill" style="top:-30px">NHANH NHANH NHANH NHANH</div>
        <div data-layout-allow-occlusion class="wall-row line" style="top:230px">NHANH NHANH NHANH NHANH</div>
        <div data-layout-allow-occlusion class="wall-row fill" style="top:490px">NHANH NHANH NHANH NHANH</div>
        <div data-layout-allow-occlusion class="wall-row line" style="top:750px">NHANH NHANH NHANH NHANH</div>
        <div data-layout-allow-occlusion class="wall-row fill" style="top:1010px">NHANH NHANH NHANH NHANH</div>
        <div data-layout-allow-occlusion class="wall-row line" style="top:1270px">NHANH NHANH NHANH NHANH</div>
        <div data-layout-allow-occlusion class="wall-row fill" style="top:1530px">NHANH NHANH NHANH NHANH</div>
      </div>
      <div id="b4-behind" class="behind" data-layout-allow-occlusion><div id="b4-l1" data-layout-allow-occlusion>CHỈ 1</div><div id="b4-l2" data-layout-allow-occlusion>CLICK</div></div>

      <div id="cam-fg" class="cam">
        <video id="v-person" src="assets/person.webm" muted playsinline data-start="0" data-duration="10.4" data-track-index="2"></video>
      </div>

      <!-- text in front of the person -->
      <div id="b1-front" class="front"><div id="b1-script">kiểu này</div></div>
      <div id="b2-front" class="front"><div id="b2-pill">3 giây đổi 1 kiểu</div></div>
      <div id="b3-front" class="front">
        <div id="b3-title">TRƯỚC <span>/</span> SAU</div>
        <div class="tag" id="tag-before" style="left:70px; top:790px"><i style="background:#ff4d4d"></i>Trước</div>
        <div class="tag" id="tag-after" style="left:420px; top:350px"><i style="background:#3dff7a"></i>Sau</div>
      </div>
      <div id="b4-front" class="front">
        <div id="b4-script">thử ngay nhé</div>
        <svg class="burst" id="burst-1" style="left:40px; top:1080px" viewBox="0 0 100 100"><path d="M50 0 L58 38 L100 30 L64 54 L86 96 L50 68 L14 96 L36 54 L0 30 L42 38 Z" fill="#d4ff3a"/></svg>
        <svg class="burst" id="burst-2" style="left:850px; top:960px; width:150px; height:150px" viewBox="0 0 100 100"><path d="M50 0 L58 38 L100 30 L64 54 L86 96 L50 68 L14 96 L36 54 L0 30 L42 38 Z" fill="#ff5ad1"/></svg>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const cams = ["#cam-bg", "#cam-fg"];
      const B = [0, 2.6, 5.2, 7.8, 10.4];

      // whip-zoom between beats: blur + overshoot out of the old look, settle into the new one
      function whip(t, to) {
        tl.to(cams, { filter: "blur(16px)", scale: "+=0.08", duration: 0.12, ease: "power2.in" }, t - 0.12);
        tl.set(cams, Object.assign({ filter: "blur(16px)" }, to), t);
        tl.to(cams, { filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, t);
      }

      // ---- beat 1: punch-in close, EDIT behind head
      tl.fromTo(cams, { scale: 1.22, x: 0, y: 0, rotation: 0, filter: "blur(0px)", clipPath: "inset(0% round 0px)" },
        { scale: 1.32, duration: B[1], ease: "none" }, 0);
      tl.set("#b1-behind", { opacity: 1 }, 0);
      tl.fromTo("#b1-big", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.1);
      tl.to("#b1-big", { scale: 1.06, duration: 2.0, ease: "none" }, 0.5);
      tl.set("#b1-front", { opacity: 1 }, 0);
      tl.fromTo("#b1-script", { opacity: 0, scale: 0.6, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.45, ease: "back.out(2)" }, 0.55);
      tl.to(["#b1-behind", "#b1-front"], { opacity: 0, duration: 0.1 }, B[1] - 0.1);

      // ---- beat 2: wide, wall of NHANH scrolling behind
      whip(B[1], { scale: 1.0, x: 0, y: 0 });
      tl.to(cams, { scale: 1.06, rotation: 1.5, duration: 2.4, ease: "sine.inOut" }, B[1] + 0.05);
      tl.set(["#b2-behind", "#b2-front"], { opacity: 1 }, B[1]);
      gsap.utils.toArray(".wall-row").forEach((row, i) => {
        const dir = i % 2 ? 1 : -1;
        tl.fromTo(row, { x: dir * -260 }, { x: dir * 120, duration: 2.6, ease: "none" }, B[1]);
        tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out" }, B[1] + i * 0.035);
      });
      tl.fromTo("#b2-pill", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, B[1] + 0.35);
      tl.to(["#b2-behind", "#b2-front"], { opacity: 0, duration: 0.1 }, B[2] - 0.1);

      // ---- beat 3: footage shrinks into an "after" card, raw "before" card on the left
      whip(B[2], { scale: 0.62, x: 175, y: 140, rotation: 0, clipPath: "inset(0% round 70px)" });
      tl.to(cams, { y: 120, duration: 2.4, ease: "sine.inOut" }, B[2] + 0.05);
      tl.fromTo("#before-wrap", { opacity: 0, scale: 0.34, x: -345, y: 230, rotation: -5 },
        { opacity: 1, rotation: -3, duration: 0.4, ease: "power3.out" }, B[2] + 0.15);
      tl.set("#b3-front", { opacity: 1 }, B[2]);
      tl.fromTo("#b3-title", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, B[2] + 0.1);
      tl.fromTo(["#tag-before", "#tag-after"], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.4)", stagger: 0.15 }, B[2] + 0.45);
      tl.to(["#b3-front", "#before-wrap"], { opacity: 0, duration: 0.1 }, B[3] - 0.1);

      // ---- beat 4: back to full frame, CHỈ 1 CLICK behind, stickers pop
      whip(B[3], { scale: 1.04, x: 0, y: 0, rotation: -2, clipPath: "inset(0% round 0px)" });
      tl.to(cams, { scale: 1.12, rotation: 0, duration: 2.6, ease: "power1.out" }, B[3] + 0.05);
      tl.set(["#b4-behind", "#b4-front"], { opacity: 1 }, B[3]);
      tl.fromTo("#b4-l1", { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, B[3] + 0.08);
      tl.fromTo("#b4-l2", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, B[3] + 0.3);
      tl.fromTo(["#burst-1", "#burst-2"], { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)", stagger: 0.12 }, B[3] + 0.6);
      tl.to(["#burst-1", "#burst-2"], { rotation: "+=40", duration: 1.6, ease: "none" }, B[3] + 1.0);
      tl.fromTo("#b4-script", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, B[3] + 0.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
